services:
  mariadb11:
    image: mariadb:11
    container_name: mariadb11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "123456"
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - mynet

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb11
      PMA_PORT: "3306"
    ports:
      - "8081:80"
    networks:
      - mynet
    depends_on:
      - mariadb11

volumes:
  mariadb_data:

networks:
  mynet:

